name: bookmarkbackup

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pavol
      POSTGRES_PASSWORD: bookmark
      POSTGRES_DB: bookmark_backup
    ports:
      - "5430:5432"
    volumes:
      - bookmark_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavol -d bookmark_backup"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pavol:bookmark@db:5432/bookmark_backup
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn bookmark_backup.web.app:app
        --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  bookmark_pg_data:
